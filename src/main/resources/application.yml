quarkus:
  application:
    name: kruize-optimizer-service
    version: 1.0.0
  smallrye-openapi:
    path: /openapi
  swagger-ui:
    path: /swagger-ui
    always-include: ${ENABLE_SWAGGER:false}

  # Enable configuration for a production-ready logging environment
  log:
    console:
      json:
        enabled: false
        pretty-print: false

# --- Kruize Optimizer Configuration ---
kruize:
  # URL of the Kruize Autotune service
  # In k8s: http://<service-name>.<namespace>:<port>
  url: ${KRUIZE_URL:http://kruize:8080}
  bulk:
    scheduler:
      # Interval to call bulk API (cron format or duration)
      interval: ${KRUIZE_BULK_SCHEDULER_INTERVAL:15m}
      # Measurement duration for bulk API calls
      measurement-duration: ${KRUIZE_BULK_MEASUREMENT_DURATION:15min}
  webhook:
    # Webhook URL for bulk API callbacks
    url: ${KRUIZE_WEBHOOK_URL:http://optimizer:8080/webhook}
  target:
    labels:
      # Max number of labels to process
      limit: ${KRUIZE_TARGET_LABEL_LIMIT:10}
      # Pass labels as a JSON String (Object or Array of "key=value")
      json: '${KRUIZE_TARGET_LABELS:{"kruize/autotune": "enabled"}}'
