apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - ../../base

patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KRUIZE_DEFAULT_DATASOURCE
          value: "prometheus-1"
    target:
      kind: Deployment
      name: kruize-optimizer
      
